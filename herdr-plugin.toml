id = "gcaudan.explorer"
name = "Explorer"
version = "0.7.1"
min_herdr_version = "0.9.4"
description = "VS Code-style file explorer, preview, search and source control for every tab"
platforms = ["linux", "macos", "windows"]

[[startup]]
command = ["node", "src/hook.js", "--restore"]

[[events]]
on = "tab.created"
command = ["node", "src/hook.js"]

[[events]]
on = "tab.closed"
command = ["node", "src/hook.js", "--closed"]

[[events]]
on = "workspace.closed"
command = ["node", "src/hook.js", "--closed"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "src/hook.js", "--agent"]

[[events]]
on = "tab.focused"
command = ["node", "src/hook.js", "--focused"]

[[panes]]
id = "tree"
title = "Explorer"
placement = "split"
command = ["node", "src/explorer.js"]

[[panes]]
id = "preview"
title = "Preview"
placement = "split"
command = ["node", "src/preview.js"]

[[panes]]
id = "search"
title = "Search"
placement = "tab"
command = ["node", "src/search.js"]

[[panes]]
id = "scm"
title = "Source Control"
placement = "tab"
command = ["node", "src/scm.js"]

[[panes]]
id = "diff"
title = "Changes"
placement = "split"
command = ["node", "src/diff.js"]

[[panes]]
id = "edit"
title = "Editor"
placement = "tab"
command = ["node", "src/edit.js"]

[[actions]]
id = "toggle"
title = "Open, focus or close the explorer"
contexts = ["tab"]
command = ["node", "src/hook.js", "--toggle"]

[[actions]]
id = "search"
title = "Go to file"
contexts = ["tab"]
command = ["node", "src/hook.js", "--search"]

[[actions]]
id = "scm"
title = "Source control"
contexts = ["tab"]
command = ["node", "src/hook.js", "--scm"]

[[actions]]
id = "peek"
title = "Preview the last changed file"
contexts = ["tab"]
command = ["node", "src/peek.js", "--last"]

[[actions]]
id = "open-link"
title = "Preview the file of a clicked link"
command = ["node", "src/peek.js", "--url"]

# Ctrl-click on a file:// hyperlink (OSC 8) in any pane: the file in the tab's preview.
[[link_handlers]]
id = "file"
title = "Preview the file"
pattern = "^file://"
action = "open-link"
