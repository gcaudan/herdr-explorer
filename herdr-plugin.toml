id = "gcaudan.explorer"
name = "Explorer"
version = "0.7.0"
min_herdr_version = "0.9.3"
description = "VS Code-style file explorer, preview, search and source control for every tab"
platforms = ["linux", "macos", "windows"]

[[startup]]
command = ["node", "src/hook.js", "--restore"]

[[events]]
on = "tab.created"
command = ["node", "src/hook.js"]

[[panes]]
id = "tree"
title = "Explorer"
placement = "split"
command = ["node", "src/explorer.js"]

[[panes]]
id = "preview"
title = "Preview"
placement = "split"
command = ["node", "src/preview.js"]

[[panes]]
id = "search"
title = "Search"
placement = "popup"
width = "80%"
height = "80%"
command = ["node", "src/search.js"]

[[panes]]
id = "scm"
title = "Source Control"
placement = "zoomed"
command = ["node", "src/scm.js"]

[[panes]]
id = "diff"
title = "Changes"
placement = "zoomed"
command = ["node", "src/diff.js"]

[[panes]]
id = "edit"
title = "Editor"
placement = "zoomed"
command = ["node", "src/edit.js"]

[[actions]]
id = "toggle"
title = "Show or hide the explorer"
contexts = ["tab"]
command = ["node", "src/hook.js", "--toggle"]

[[actions]]
id = "search"
title = "Go to file"
contexts = ["tab"]
command = ["node", "src/hook.js", "--search"]

[[actions]]
id = "scm"
title = "Source control"
contexts = ["tab"]
command = ["node", "src/hook.js", "--scm"]

[[actions]]
id = "peek"
title = "Preview the last changed file"
contexts = ["tab"]
command = ["node", "src/peek.js", "--last"]
