id = "gcaudan.explorer"
name = "Explorer"
version = "1.0.0"
min_herdr_version = "0.9.4"
description = "VS Code-style file explorer, preview, search and source control for every tab"
platforms = ["linux", "macos", "windows"]

# The binary, bin/herdr-explorer, fetched for herdr plugin install and update: every command below runs it, without
# another runtime. The explorer and the preview are their own launcher, which fetches it as well before a restart on new code.
[[build]]
platforms = ["linux", "macos"]
command = ["sh", "scripts/fetch-bin.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell", "-ExecutionPolicy", "Bypass", "-File", "scripts/fetch-bin.ps1"]

[[startup]]
command = ["bin/herdr-explorer", "hook", "--restore"]

[[events]]
on = "tab.created"
command = ["bin/herdr-explorer", "hook"]

[[events]]
on = "tab.closed"
command = ["bin/herdr-explorer", "hook", "--closed"]

[[events]]
on = "workspace.closed"
command = ["bin/herdr-explorer", "hook", "--closed"]

[[events]]
on = "pane.agent_status_changed"
command = ["bin/herdr-explorer", "hook", "--agent"]

[[events]]
on = "tab.focused"
command = ["bin/herdr-explorer", "hook", "--focused"]

[[panes]]
id = "tree"
title = "Explorer"
placement = "split"
command = ["bin/herdr-explorer", "pane", "tree"]

[[panes]]
id = "preview"
title = "Preview"
placement = "split"
command = ["bin/herdr-explorer", "pane", "preview"]

[[panes]]
id = "search"
title = "Search"
placement = "tab"
command = ["bin/herdr-explorer", "pane", "search"]

[[panes]]
id = "scm"
title = "Source Control"
placement = "tab"
command = ["bin/herdr-explorer", "pane", "scm"]

[[panes]]
id = "diff"
title = "Changes"
placement = "split"
command = ["bin/herdr-explorer", "pane", "diff"]

[[panes]]
id = "edit"
title = "Editor"
placement = "tab"
command = ["bin/herdr-explorer", "pane", "edit"]

[[actions]]
id = "toggle"
title = "Open or close the explorer"
contexts = ["tab"]
command = ["bin/herdr-explorer", "hook", "--toggle"]

[[actions]]
id = "search"
title = "Go to file"
contexts = ["tab"]
command = ["bin/herdr-explorer", "hook", "--search"]

[[actions]]
id = "scm"
title = "Source control"
contexts = ["tab"]
command = ["bin/herdr-explorer", "hook", "--scm"]

[[actions]]
id = "peek"
title = "Preview the last changed file"
contexts = ["tab"]
command = ["bin/herdr-explorer", "peek", "--last"]

[[actions]]
id = "open-link"
title = "Preview the file of a clicked link"
command = ["bin/herdr-explorer", "peek", "--url"]

# Ctrl-click on a file:// hyperlink (OSC 8) in any pane: the file in the tab's preview.
[[link_handlers]]
id = "file"
title = "Preview the file"
pattern = "^file://"
action = "open-link"
