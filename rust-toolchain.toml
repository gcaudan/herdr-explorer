# The toolchain every build uses, locally (rustup) and in CI: the stable of the day the rewrite started.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
profile = "minimal"
