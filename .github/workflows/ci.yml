# Quick checks on every pull request and push to main: scripts parse, terminal width helpers, doc links; the Rust
# crate's format, lints (host and the 5 release targets) and tests.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 24] # 20 is the minimum the docs give
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  cargo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runners' rustup installs the toolchain, components and targets pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      # Compiles each release target's FFI without linking it.
      - run: |
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin \
            x86_64-pc-windows-msvc; do
            cargo clippy --manifest-path rust/Cargo.toml --target $t -- -D warnings
          done
      - run: cargo test --manifest-path rust/Cargo.toml
      # The shell scripts parse: scripts/ as POSIX sh (dash on Ubuntu), the installer as bash; fetch-bin
      # itself runs in cargo test's tests/fetch_bin.rs.
      - name: Parse the shell scripts
        if: runner.os == 'Linux'
        run: |
          for f in scripts/*.sh; do sh -n "$f"; done
          bash -n install.sh
      # The PowerShell scripts parse in Windows PowerShell 5.1, which herdr's [[build]] runs.
      - name: Parse the PowerShell scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          foreach ($f in @(Get-Item install.ps1) + @(Get-ChildItem scripts -Filter *.ps1)) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=$($f.Name)::$($e.Extent.StartLineNumber): $($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
