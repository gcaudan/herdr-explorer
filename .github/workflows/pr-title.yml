# The pull request title in Conventional Commits: squashed, it becomes the commit message of main, from which
# release-please computes the next version and writes CHANGELOG.md. pull_request_target, so that a pull request from a
# fork gets a token too; the job checks out nothing and runs no code of the pull request.
name: pr-title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            docs
            style
            refactor
            test
            build
            ci
            chore
            revert
          requireScope: false
