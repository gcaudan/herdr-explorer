# Release on every push to main: release-please opens or updates the release pull request from the Conventional
# Commits (version in herdr-plugin.toml, CHANGELOG.md); merging it creates the tag vX.Y.Z and a draft GitHub release,
# the binaries of the 5 targets are built and attached with their SHA256SUMS, then the release is published. So
# releases/latest, which the update check reads, never gives a version without its binaries.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

# One release at a time: two quick merges must not both publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Creates the tag and the draft release when the push merges the release pull request (draft and
      # force-tag-creation in release-please-config.json), otherwise opens or updates the pull request.
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      # The manifest must parse and carry the version release-please set, as the update check reads it. Both files
      # are read at the same ref, so a branch not yet updated still gives a consistent answer.
      - name: Check the release pull request
        if: steps.rp.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.rp.outputs.pr || '{}').headBranchName }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          file() { gh api "repos/$GITHUB_REPOSITORY/contents/$1?ref=$BRANCH" --jq .content | base64 -d; }
          toml=$(file herdr-plugin.toml | python3 -c "import sys, tomllib; print(tomllib.loads(sys.stdin.read())['version'])") \
            || fail "herdr-plugin.toml does not parse on $BRANCH"
          manifest=$(file .release-please-manifest.json | jq -r '."."')
          [[ "$toml" == "$manifest" ]] || fail "herdr-plugin.toml is $toml, .release-please-manifest.json is $manifest on $BRANCH"

      # The update check only accepts digits and dots, and compares the tag with the version in the manifest.
      - name: Verify the release
        if: steps.rp.outputs.release_created
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          version="${TAG#v}"
          [[ "$TAG" == "v$version" && "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]] || fail "tag $TAG is not vX.Y.Z"
          gh api "repos/$GITHUB_REPOSITORY/contents/herdr-plugin.toml?ref=$TAG" --jq .content | base64 -d \
            | grep -qx "version = \"$version\"" || fail "herdr-plugin.toml at $TAG is not $version"
          echo "release $TAG verified"

  # The assets of the contract fetch-bin, the updater and the shims read: bare binaries named after their target,
  # built at the tag with the toolchain of rust-toolchain.toml. x86_64-apple-darwin is cross-compiled, no Intel macOS
  # runner being left.
  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: .exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag }}
      ASSET: herdr-explorer-${{ matrix.target }}${{ matrix.ext }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - run: rustup toolchain install
      - run: cargo build --manifest-path rust/Cargo.toml --release --locked --target ${{ matrix.target }}
      # gh finds a draft release by its tag; a release just created can take a moment to be seen, hence the tries.
      - name: Attach the binary
        run: |
          set -euo pipefail
          cp "rust/target/${{ matrix.target }}/release/herdr-explorer${{ matrix.ext }}" "$ASSET"
          for try in 1 2 3 4 5; do
            gh release upload "$TAG" "$ASSET" --clobber && exit 0
            sleep $((try * 10))
          done
          echo "::error::cannot attach $ASSET to $TAG"
          exit 1

  # SHA256SUMS of the binaries as attached, then the release published: only when every target is there.
  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - name: Publish the release
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          mkdir assets
          cd assets
          gh release download "$TAG" --pattern 'herdr-explorer-*'
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin \
            x86_64-pc-windows-msvc.exe; do
            [[ -s "herdr-explorer-$t" ]] || fail "herdr-explorer-$t is missing from $TAG"
          done
          [[ $(ls | wc -l) -eq 5 ]] || fail "$TAG has assets other than the 5 binaries: $(ls | tr '\n' ' ')"
          sha256sum herdr-explorer-* >SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false
          echo "release $TAG published"
